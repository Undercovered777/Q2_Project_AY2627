<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <title>2nd Quarter | Drill 2</title>
    <style>
        .site-nav {
            background: linear-gradient(90deg, #7a0c1e, #b3122b 50%, #7a0c1e);
            border-bottom: 3px solid #f0b323;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
            font-family: 'Orbitron', sans-serif;
        }

        .site-nav .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffd966;
        }

        .site-nav .mini-reactor {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #7df9ff 35%, #1b6f78 70%, #0b2f33 100%);
            border: 2px solid #f0b323;
            box-shadow: 0 0 10px #7df9ff;
        }

        .site-nav .nav-link {
            padding: 0.55rem 1rem;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #ffd966;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid transparent;
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .site-nav .nav-link:hover {
            color: #ffd966;
            background: rgba(0, 0, 0, 0.5);
            border-color: #f0b323;
            box-shadow: 0 0 12px rgba(240, 179, 35, 0.45);
        }

        .site-nav .nav-link.active {
            color: #15161a;
            background: #f0b323;
            border-color: #ffd966;
        }

        .site-nav .nav-link:focus-visible,
        .site-nav .navbar-toggler:focus-visible {
            outline: 2px solid #7df9ff;
            outline-offset: 2px;
            box-shadow: none;
        }

        .site-nav .navbar-toggler {
            border-color: #f0b323;
            background: rgba(0, 0, 0, 0.3);
        }

        .site-nav .navbar-toggler-icon {
            filter: invert(85%) sepia(40%) saturate(900%) hue-rotate(2deg);
        }

        @media (max-width: 991.98px) {
            .site-nav .nav-link { text-align: center; margin-top: 0.4rem; }
        }

        .site-footer {
            text-align: center;
            padding: 1.2rem 1rem;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            color: #d6d6d6;
            background: linear-gradient(90deg, #7a0c1e, #b3122b, #7a0c1e);
            border-top: 4px solid #f0b323;
        }

        .site-footer span { color: #ffd966; font-weight: 600; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg sticky-top site-nav" aria-label="Main navigation">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="index.html">
                <span class="mini-reactor" aria-hidden="true"></span>
                ICT Club
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="mainNav">
                <ul class="navbar-nav gap-lg-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">Homepage</a></li>
                    <li class="nav-item"><a class="nav-link" href="element-checker.html">Element Checker</a></li>
                    <li class="nav-item"><a class="nav-link active" href="club-members.html" aria-current="page">School Club Members</a></li>
                    <li class="nav-item"><a class="nav-link" href="creator.html">Meet the Creator</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 flex-grow-1">
        <h3 class="mb-4">Add new club member:</h3>
        <form class="mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
            </div>
            <input type="button" value="Submit" py-click="result_checker" class="btn btn-primary">
        </form>
        <div id="output" class="p-3 rounded" style="background-color: crimson; color: chartreuse; font-size: 20px;"></div>
    </div>

    <footer class="site-footer">
        &copy; 2026 <span>ICT Club</span> &bull; Drill 2 &bull; 2nd Quarter
    </footer>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
